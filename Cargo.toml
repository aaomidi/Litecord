[package]
name = "litecord"
version = "1.3.1-beta"
edition = "2021"
description = "Ultra-lightweight, high-performance native Discord client in Rust with custom speech ducking"
authors = ["Litecord Project"]
license = "MIT"
repository = "https://github.com/Ak4ai/Litecord"
readme = "README.md"

[features]
default = ["vaapi"]
# Test-only remote control of the UI (see src/automation.rs). Never enable for releases.
automation = []
# Linux: H.264 screen-share encoding on the GPU through GStreamer's VA-API elements
# (src/encoder/vaapi.rs). Does nothing on other systems.
vaapi = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-allocators"]

[dependencies]
slint = "1.9"
i-slint-backend-winit = "1.9"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking", "socks"] }
tray-icon = "0.19"
# Same version Slint's winit backend already builds; only used to copy the network report.
copypasta = { version = "0.10", default-features = false }
# Optional browser viewers (sans-IO). DTLS also brings the aws-lc native dependency.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
winit = "0.30"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
raw-window-handle = "0.6"
cpal = "0.15"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
opus-rs = "0.1.26"
davey = "0.1.4"
# Go Live (screen_capture::golive): the stream connection has its own DAVE session on the
# newer davey, whose sender switches keys when a transition is executed, as the protocol
# says. Voice (gateway::voice) stays on 0.1.4.
davey02 = { package = "davey", version = "=0.2.0" }
image = "0.25"
qrcode = "0.14"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.11"
rand = "0.8"
mimalloc = { version = "0.1", default-features = false }
cameras = "0.1"
jpeg-encoder = { version = "0.7", features = ["simd"] }
zune-jpeg = "0.4"
openh264 = "0.9"
# Parameter sets and slice headers for the GPU decoder (the GPU decodes the rest).
h264-reader = "0.9"
socket2 = "0.5"
rayon = "1.10"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
nnnoiseless = { version = "0.5", default-features = false }

[dev-dependencies]
# The scripted voice gateway of the Go Live tests is an MLS external sender, as Discord's is.
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"

[[bin]]
name = "litecord"
path = "src/main.rs"

[[bin]]
name = "test_nvenc"
path = "src/bin/test_nvenc.rs"

[[bin]]
name = "test_wmf"
path = "src/bin/test_wmf.rs"

[[bin]]
name = "test_ffmpeg_nvenc"
path = "src/bin/test_ffmpeg_nvenc.rs"

[[bin]]
name = "test_amd_amf_pipeline"
path = "src/bin/test_amd_amf_pipeline.rs"

[[bin]]
name = "test_amd_sender"
path = "src/bin/test_amd_sender.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Foundation_Numerics",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
] }
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input",
] }
windows-capture = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "0.14", features = ["allow-unsafe-code"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
libc = "0.2"
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }
# The file descriptor of a decoded picture's DMABuf (screen_capture::hw_decode::gl_present).
gstreamer-allocators = { version = "0.25", optional = true }

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 256
lto = "off"
strip = false


# Local copy of i-slint-core 1.17.1 with one fix: a mouse-wheel scroll animation could get
# stuck (subnormal velocity, zero-length steps) and keep the UI redrawing ~130 times per
# second forever, even hidden in the tray. See step_internal in
# vendor/i-slint-core/animations/physics_simulation.rs.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
# Local copy of i-slint-backend-winit 1.17.1 with one fix: an animation running while the
# window is hidden in the tray made the event loop request redraws forever. See
# about_to_wait in vendor/i-slint-backend-winit/event_loop.rs.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
